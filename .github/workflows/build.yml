name: Build & Test

# Runs on pull requests only. Pushes to master do not build or test: master is
# only ever changed by merging a PR that already passed this workflow, and a
# release tag (vX.Y.Z) triggers release.yml, which packages without testing.
# workflow_dispatch allows a manual run on any branch.
on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR cancels the run still in flight for it.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# sccache keeps compiled objects in the GitHub Actions cache, so a PR rebuilds
# only the translation units it touched. Jobs opt in by running
# mozilla-actions/sccache-action and passing it as the compiler launcher.
env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Linux: Build and test in Docker container (full network access).
  # Tests run through CTest inside the container: one process per test,
  # per-test timeout, and bounded retries for transient timing misses.
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build in Docker
        run: docker build -t mafianet-test .

      - name: Run tests in Docker
        run: |
          mkdir -p test-results
          docker run --rm -v "$PWD/test-results:/results" mafianet-test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: test-results/junit.xml
          if-no-files-found: ignore

  # Native Linux builds. Batched datagram I/O (recvmmsg/sendmmsg) is always on
  # here -- it is a platform capability, not an option -- so these are the jobs
  # that compile and exercise it over real loopback traffic.
  #
  # Both configurations, because each covers what the other cannot:
  #   Debug   - RakAssert is compiled out unless _DEBUG, and it is what guards the
  #             invariants these paths rely on (the SendBatch count-not-bytes
  #             return contract, the RNS2SendBatch reentrancy guard, the
  #             IPv4-only address branch). Only here do those checks run.
  #   Release - the configuration that actually ships. Exercises the NDEBUG
  #             behaviour the asserts hide: the oversized-datagram drop backstop
  #             (its unit test skips itself under _DEBUG, where the assert fires
  #             first) and the silent IPv4-only branch in the sendmmsg override.
  linux-native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    name: linux-native (${{ matrix.build_type }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      # File names under Source/ are snake_case, and library headers include each
      # other only as "mafianet/<name>.h". A bare #include "string.h" inside
      # include/mafianet/ would resolve to the library's own string.h instead of
      # the C header, so both rules are enforced here.
      - name: Check file naming and include style
        run: |
          bad=$(find Source/include Source/src -type f \( -name '*.h' -o -name '*.cpp' \) | grep -E '/[^/]*[A-Z][^/]*$' || true)
          if [ -n "$bad" ]; then echo "Non-snake_case file names:"; echo "$bad"; exit 1; fi
          bad=$(grep -rnE '^\s*#include "[a-z0-9_]+\.h"' Source/include/mafianet | while IFS=: read -r f l rest; do
                  n=$(echo "$rest" | sed -E 's/.*"([^"]+)".*/\1/')
                  [ -e "Source/include/mafianet/$n" ] && echo "$f:$l: $rest"; done || true)
          if [ -n "$bad" ]; then echo "Bare includes of library headers (use \"mafianet/<name>.h\"):"; echo "$bad"; exit 1; fi

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DMAFIANET_BUILD_TESTS=ON \
            -DMAFIANET_BUILD_EXTRAS=ON

      - name: Build
        run: cmake --build build --parallel 4

      # The unit suite is hermetic and deterministic by construction, so it runs
      # exactly once: retrying it could only ever hide a genuine nondeterminism
      # bug. Retries are reserved for the integration suite, where they absorb
      # real loopback timing misses.
      - name: Run unit tests
        run: |
          ctest --test-dir build -L unit \
            --output-on-failure \
            --timeout 600 \
            --output-junit junit-unit.xml

      - name: Run integration tests
        run: |
          ctest --test-dir build -L integration \
            --output-on-failure \
            --repeat until-pass:3 \
            --timeout 600 \
            --output-junit junit-integration.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-native-${{ matrix.build_type }}
          path: build/junit-*.xml
          if-no-files-found: ignore

  # Minimal configuration: every optional plugin compiled out through
  # MAFIANET_MINIMAL (see docs/getting-started/building.rst, "Minimal builds").
  # Proves the core transport builds without the plugins and that no plugin
  # header leaks into the core. The test suites use the plugins, so this job
  # builds both library targets and nothing else.
  linux-minimal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure CMake (minimal)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DMAFIANET_MINIMAL=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Report library size
        run: ls -l build/Source/libMafiaNetStatic.a build/Source/libmafianet.so*

  # Sanitizers, via the asan / tsan presets (RelWithDebInfo + tests; see
  # CMakePresets.json for why not Debug). Every target is instrumented,
  # third-party dependencies included, so TSan sees both sides of each access.
  #
  # TSan is advisory: RakNet's public getters read connection state owned by the
  # network thread without locking, by design. Those races are baselined in
  # ci/tsan.supp so the job flags new ones; removing them needs a
  # concurrency-model change, not a CI tweak.
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.preset == 'tsan' }}
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    name: sanitizers (${{ matrix.preset }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build clang

      # Ubuntu 24.04 runners use 32 bits of mmap randomisation, which older TSan
      # runtimes cannot map their shadow memory around.
      - name: Reduce ASLR entropy for TSan
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure CMake
        run: |
          cmake --preset ${{ matrix.preset }} -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run unit tests
        run: |
          ctest --preset ${{ matrix.preset }} -L unit \
            --parallel 4 \
            --output-junit junit-unit.xml

      # Retries absorb loopback timing misses, which sanitizer slowdown makes
      # more frequent. They must not absorb a sanitizer report, so the log of
      # every attempt is kept and the next step fails on any report in it.
      - name: Run integration tests
        run: |
          ctest --preset ${{ matrix.preset }} -L integration \
            --repeat until-pass:3 \
            --output-log build/${{ matrix.preset }}/integration.log \
            --output-junit junit-integration.xml

      - name: Fail on sanitizer reports from any attempt
        run: |
          # A missing log would make grep exit 2, which the if reads as "clean".
          test -f build/${{ matrix.preset }}/integration.log || { echo "::error::integration.log missing"; exit 1; }
          if grep -nE 'ERROR: AddressSanitizer|WARNING: ThreadSanitizer|runtime error:' \
               build/${{ matrix.preset }}/integration.log; then
            echo "::error::A sanitizer reported an error in an attempt that a retry later passed"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sanitizers-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/junit-*.xml
            build/${{ matrix.preset }}/integration.log
          if-no-files-found: ignore

  # macOS: Build and run both suites (unit + integration).
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install OpenSSL
        run: brew install openssl@3

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure CMake
        run: |
          cmake -B build \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3) \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DMAFIANET_BUILD_SAMPLES=ON \
            -DMAFIANET_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run tests
        run: |
          ctest --test-dir build \
            --output-on-failure \
            --repeat until-pass:3 \
            --timeout 600 \
            --output-junit junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: build/junit.xml
          if-no-files-found: ignore

  # Windows: Build everything, run the hermetic unit suite. The legacy
  # integration suite (loopback networking) is not yet validated on Windows
  # runners, so it stays build-only for now.
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure CMake
        run: cmake -B build -DMAFIANET_BUILD_SAMPLES=ON -DMAFIANET_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run unit tests
        run: |
          ctest --test-dir build -C Release -L unit `
            --output-on-failure `
            --timeout 600 `
            --output-junit junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: build/junit.xml
          if-no-files-found: ignore
