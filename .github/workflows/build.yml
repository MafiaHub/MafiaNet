name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Linux: Build and test in Docker container (full network access).
  # Tests run through CTest inside the container: one process per test,
  # per-test timeout, and bounded retries for transient timing misses.
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build in Docker
        run: docker build -t mafianet-test .

      - name: Run tests in Docker
        run: |
          mkdir -p test-results
          docker run --rm -v "$PWD/test-results:/results" mafianet-test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: test-results/junit.xml
          if-no-files-found: ignore

  # Native Linux builds. Batched datagram I/O (recvmmsg/sendmmsg) is always on
  # here -- it is a platform capability, not an option -- so these are the jobs
  # that compile and exercise it over real loopback traffic.
  #
  # Both configurations, because each covers what the other cannot:
  #   Debug   - RakAssert is compiled out unless _DEBUG, and it is what guards the
  #             invariants these paths rely on (the SendBatch count-not-bytes
  #             return contract, the RNS2SendBatch reentrancy guard, the
  #             IPv4-only address branch). Only here do those checks run.
  #   Release - the configuration that actually ships. Exercises the NDEBUG
  #             behaviour the asserts hide: the oversized-datagram drop backstop
  #             (its unit test skips itself under _DEBUG, where the assert fires
  #             first) and the silent IPv4-only branch in the sendmmsg override.
  linux-native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    name: linux-native (${{ matrix.build_type }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DMAFIANET_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 4

      # The unit suite is hermetic and deterministic by construction, so it runs
      # exactly once: retrying it could only ever hide a genuine nondeterminism
      # bug. Retries are reserved for the integration suite, where they absorb
      # real loopback timing misses.
      - name: Run unit tests
        run: |
          ctest --test-dir build -L unit \
            --output-on-failure \
            --timeout 600 \
            --output-junit junit-unit.xml

      - name: Run integration tests
        run: |
          ctest --test-dir build -L integration \
            --output-on-failure \
            --repeat until-pass:3 \
            --timeout 600 \
            --output-junit junit-integration.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-native-${{ matrix.build_type }}
          path: build/junit-*.xml
          if-no-files-found: ignore

  # macOS: Build and run both suites (unit + integration).
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install OpenSSL
        run: brew install openssl@3

      - name: Configure CMake
        run: |
          cmake -B build \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3) \
            -DMAFIANET_BUILD_SAMPLES=ON \
            -DMAFIANET_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run tests
        run: |
          ctest --test-dir build \
            --output-on-failure \
            --repeat until-pass:3 \
            --timeout 600 \
            --output-junit junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: build/junit.xml
          if-no-files-found: ignore

  # Windows: Build everything, run the hermetic unit suite. The legacy
  # integration suite (loopback networking) is not yet validated on Windows
  # runners, so it stays build-only for now.
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure CMake
        run: cmake -B build -DMAFIANET_BUILD_SAMPLES=ON -DMAFIANET_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run unit tests
        run: |
          ctest --test-dir build -C Release -L unit `
            --output-on-failure `
            --timeout 600 `
            --output-junit junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: build/junit.xml
          if-no-files-found: ignore
