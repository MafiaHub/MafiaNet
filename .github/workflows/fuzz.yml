name: Nightly fuzzing and soak

# Longer libFuzzer runs than the per-PR smoke job in build.yml. The corpus each
# run grows is cached and restored by the next, so coverage keeps building up
# across nights instead of restarting from Tests/Fuzz/corpus every time.
#
# The soak job runs the opt-in soak suite (MAFIANET_BUILD_SOAK_TESTS, CTest
# label "soak"): hundreds of simulated peers over many minutes of virtual time,
# and a threaded loopback run of minutes. Never part of the per-PR runs.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per harness
        default: "900"

permissions:
  contents: read

jobs:
  # fuzz: optimized, NDEBUG, as shipped. fuzz-debug: RakAssert enabled, so any
  # assert a remote can reach through crafted input is reported as a crash.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [fuzz, fuzz-debug]
    name: fuzz (${{ matrix.preset }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config ninja-build clang

      - name: Build harnesses
        run: |
          cmake --preset ${{ matrix.preset }} -G Ninja
          cmake --build --preset ${{ matrix.preset }}

      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ matrix.preset }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.preset }}-

      - name: Fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          SECONDS_PER_HARNESS: ${{ inputs.seconds || '900' }}
        run: |
          mkdir -p fuzz-artifacts
          status=0
          for harness in build/${{ matrix.preset }}/Tests/Fuzz/*_fuzz; do
            name=$(basename "$harness" _fuzz)
            mkdir -p fuzz-corpus/"$name"
            cp -n Tests/Fuzz/corpus/"$name"/* fuzz-corpus/"$name"/ || true
            echo "::group::$name"
            "$harness" fuzz-corpus/"$name" -max_total_time="$SECONDS_PER_HARNESS" \
              -print_final_stats=1 -artifact_prefix=fuzz-artifacts/"$name"- || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Save corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ matrix.preset }}-${{ github.run_id }}

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.preset }}
          path: fuzz-artifacts/

  # Tests/Soak, built with MAFIANET_BUILD_SOAK_TESTS=ON and run by label. Release
  # is what ships; ASan + UBSan and TSan run the same soak instrumented. TSan is
  # advisory, as in build.yml: the by-design getter races live in ci/tsan.supp.
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: ${{ matrix.preset == 'tsan' }}
    strategy:
      fail-fast: false
      matrix:
        preset: [release, asan, tsan]
    name: soak (${{ matrix.preset }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config ninja-build clang

      - name: Reduce ASLR entropy for TSan
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build the soak suite
        run: |
          cmake --preset ${{ matrix.preset }} -G Ninja \
            -DMAFIANET_BUILD_TESTS=ON \
            -DMAFIANET_BUILD_SOAK_TESTS=ON \
            -DMAFIANET_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build build/${{ matrix.preset }} --target SoakTests

      # The release preset has no test preset; the sanitizer presets carry their
      # ASAN_OPTIONS / TSAN_OPTIONS (and ci/tsan.supp) in theirs.
      - name: Run the soak suite
        run: |
          if [ "${{ matrix.preset }}" = release ]; then
            ctest --test-dir build/release -L soak --output-on-failure --timeout 7200 --output-log build/release/soak.log
          else
            ctest --preset ${{ matrix.preset }} -L soak --timeout 7200 --output-log build/${{ matrix.preset }}/soak.log
          fi

      - name: Upload the soak log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/soak.log
          if-no-files-found: ignore
